name: Build Rii Launcher APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Validate, Test & Build 120FPS APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v6

      - name: 2. Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Install Android SDK Platform 37.0 & Build Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$SDK_ROOT/platforms/android-37" ] && [ -d "$SDK_ROOT/platforms/android-37.0" ]; then
            ln -s "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
          fi

      - name: 4. Set up Gradle 9.6.0 & Cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: 5. Ensure Gradle Wrapper & Validate Gradle
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 9.6.0
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: 6. Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 7. Build Debug & R8-Optimized 120FPS Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: 8. Verify APK Outputs
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk RiiLauncher-120fps.apk
          ls -lh RiiLauncher-120fps.apk app/build/outputs/apk/debug/app-debug.apk

      - name: 9. Upload R8-Optimized Rii Launcher APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: RiiLauncher-120fps-apk
          path: RiiLauncher-120fps.apk
          retention-days: 30

      - name: 10. Publish GitHub Release (on Tag Push v*)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "Rii Launcher ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            RiiLauncher-120fps.apk
            app/build/outputs/apk/debug/app-debug.apk
